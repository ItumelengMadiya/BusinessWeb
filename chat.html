<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with us at Peters Business Solutions">
    <title>Chat with Us | Peters Business Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Use the font from the About page, e.g., Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header and Menu Styling */
        header {
            background-color: #d32f2f;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 15px;
        }

        .logo img {
            width: 130px;
            height: auto;
        }

        /* Desktop Navigation and Search Bar */
        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .desktop-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        .desktop-nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 10px;
        }

        .desktop-nav ul li a:hover {
            background-color: #b71c1c;
            border-radius: 5px;
        }

        .search-bar {
            display: flex;
            align-items: center;
        }

        .search-bar input[type="text"] {
            padding: 8px;
            border-radius: 3px;
            border: 1px solid #ccc;
            width: 150px;
        }

        .search-bar button {
            margin-left: 10px;
            padding: 8px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }

        .search-bar button i {
            color: #d32f2f;
        }

        /* Side Menu (for mobile) */
        .nav-menu {
            position: fixed;
            left: -250px;
            top: 0;
            height: 100%;
            width: 250px;
            background-color: #d32f2f;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
        }

        .nav-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-menu ul li {
            margin: 20px 0;
            text-align: center;
        }

        .nav-menu ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 10px;
        }

        .nav-menu ul li a:hover {
            background-color: #b71c1c;
        }

        .nav-menu.show {
            left: 0;
        }

        /* Menu toggle button */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: white;
        }

        .chat-section {
            background-color: #e0e0e0;
            padding: 40px 20px;
            text-align: center;
            flex: 1;
        }

        .chat-section h2 {
            color: #d32f2f;
            font-size: 2.2rem;
            margin-bottom: 30px;
        }

        .chat-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-box {
            background-color: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-box div {
            background-color: #d32f2f;
            color: white;
            border-radius: 10px;
            padding: 10px;
            max-width: 80%;
            margin: 5px auto;
            text-align: left;
        }

        .user-message {
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            outline: none;
        }

        .chat-input button {
            padding: 10px 15px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .chat-input button:hover {
            background-color: #333;
        }

        footer {
            background-color: #212121;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 768px) {
            .desktop-nav {
                display: none; /* Hide desktop navigation on mobile */
            }

            .menu-toggle {
                display: flex; /* Show menu toggle on mobile */
            }

            .nav-menu.show {
                left: 0; /* Show menu when active */
            }

            .nav-menu .search-bar {
                margin: 20px 0; /* Add margin for better spacing */
                padding: 0 20px; /* Add padding to sides */
                display: flex; /* Ensure it's a flex container */
            }

            .nav-menu .search-bar input[type="text"] {
                width: 100%; /* Adjust width to fit the container */
                padding: 10px; /* Add padding for better appearance */
                border: 1px solid #ccc;
                border-radius: 3px; /* Match the style */
            }

            .nav-menu .search-bar button {
                padding: 10px; /* Ensure button is appropriately sized */
            }
        }

        @media (max-width: 480px) {
            .chat-section h2 {
                font-size: 1.8rem;
            }

            .chat-container {
                padding: 20px;
            }

            .chat-input button {
                padding: 10px;
                font-size: 0.9rem;
            }

            .search-bar input[type="text"] {
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <img src="Logo.png" alt="Company Logo">
        </div>
        <div class="menu-toggle" id="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="desktop-nav">
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="search-bar">
                <input type="text" id="searchQuery" placeholder="Search...">
                <button onclick="performSearch()">
                    <i class="fas fa-search"></i> <!-- Font Awesome Search Icon -->
                </button>
            </div>
        </nav>
        <div class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="search-bar">
                <input type="text" id="searchQueryMobile" placeholder="Search...">
                <button onclick="performSearchMobile()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </header>

    <section class="chat-section" id="chat">
        <h2>Chat with Us</h2>
        <div class="chat-container">
            <div class="chat-box" id="chat-box">
                <div class="bot-message">Hello! How can I assist you today?</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chat-message" placeholder="Type your message...">
                <button id="send-message">Send</button>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; Designed by <a href="https://www.spacebarsolutions.co.za/" target="_blank" style="color: rgb(196, 88, 88); text-decoration: wavy;">Spacebar Solutions</a>.</p>
    </footer>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const menu = document.getElementById('menu');
        const sendMessageButton = document.getElementById('send-message');
        const chatBox = document.getElementById('chat-box');
        const chatMessageInput = document.getElementById('chat-message');

        // Toggle menu functionality
       document.getElementById('menu-toggle').addEventListener('click', function () {
            document.getElementById('nav-menu').classList.toggle('show');
        });

        // Send message functionality
        sendMessageButton.addEventListener('click', sendMessage);
        chatMessageInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                sendMessage(); // Call sendMessage function when Enter is pressed
            }
        });

        function sendMessage() {
            const userMessage = chatMessageInput.value.trim();
            if (userMessage) {
                addUserMessage(userMessage);
                chatMessageInput.value = '';
                setTimeout(() => {
                    respondToUserMessage(userMessage);
                }, 500);
            }
        }

        function addUserMessage(message) {
            const userMessageElement = document.createElement('div');
            userMessageElement.classList.add('user-message');
            userMessageElement.textContent = message;
            chatBox.appendChild(userMessageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function respondToUserMessage(message) {
            let response = '';
            message = message.toLowerCase();

            if (message.includes('services')) {
                response = `Peters Business Solutions offers a wide range of professional services to support your business, including:
                - **Accounting and Payroll**: Comprehensive month-to-month services that ensure your business stays compliant with SARS regulations.
                - **Tax Consulting**: Maximize your tax savings while staying fully compliant with all legal requirements.
                - **Business Registrations**: We can help you register your business with CIPC and provide ongoing support as your company grows.
                - **UIF, COIDA, and CIDB Registrations**: We handle all the paperwork to make sure you're registered with the necessary authorities for smooth business operations.
                
                Our mission is to provide the highest standard of service with a focus on perfection. We believe in doing things right the first time, helping our clients avoid costly mistakes and focus on growing their businesses. How can we assist you today?`;
            } else if (message.includes('accounting')) {
                response = `At Peters Business Solutions, we specialize in monthly accounting services for small to medium businesses. We take care of all your financial needs, from bookkeeping to payroll, ensuring your business remains fully SARS compliant. With over 25 years of experience in accounting, we provide tailored solutions that suit your specific business needs, helping you focus on what you do best – growing your business. Would you like to learn more about how we can assist with your accounting needs?`;
            } else if (message.includes('tax')) {
                response = `Our tax consulting services are designed to reduce your tax burden while ensuring full compliance with SARS. We work with both businesses and individuals, handling everything from tax planning to submission. We believe in legal tax reduction strategies, helping you save money while avoiding any potential penalties. We have a proven track record of helping businesses like yours optimize their tax payments. How can we assist with your tax needs?`;
            } else if (message.includes('business registration')) {
                response = `Starting a business can be overwhelming, but Peters Business Solutions is here to make the process easier. We’ve registered over 30 companies in the past six years and offer a complete business registration service through CIPC. Our team will guide you through every step, from registration to ongoing support with accounting and tax services as your business grows. Ready to take the next step in your entrepreneurial journey?`;
            } else if (message.includes('why choose')) {
                response = `Choosing Peters Business Solutions means partnering with a company that truly cares about your business success. Our focus is on providing professional, personalized services that ensure your business remains compliant with all regulations while growing sustainably. We are proud of our:
                - **Integrity**: We believe in being honest and ethical in everything we do.
                - **Leadership**: With over 25 years of experience, we lead the way in accounting, tax, and business services.
                - **Personalized Service**: Every business is unique, and we tailor our services to meet your specific needs.
                
                By choosing us, you're choosing a partner who is as invested in your success as you are. Let us handle the financial and regulatory complexities, so you can focus on what you do best. How can we assist you today?`;
            } else if (message.includes('hello') || message.includes('hi')) {
                response = 'Hello! Welcome to Peters Business Solutions. How can we assist you today? Feel free to ask about our services or any specific business challenges you need help with.';
            } else {
                response = 'I’m sorry, I didn’t quite understand your question. Could you please ask about our services, tax consulting, business registration, or anything else you’d like to know?';
            }

            const botMessageElement = document.createElement('div');
            botMessageElement.classList.add('bot-message');
            botMessageElement.textContent = response;
            chatBox.appendChild(botMessageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function performSearch() {
            const query = document.getElementById('searchQuery').value.toLowerCase();
            let pageUrl;

            switch (query) {
                case 'index':
                    pageUrl = 'index.html';
                    break;
                case 'about':
                    pageUrl = 'about.html';
                    break;
                case 'contact':
                    pageUrl = 'contact.html';
                    break;
                case 'chat':
                    pageUrl = 'chat.html';
                    break;
                case 'services':
                    pageUrl = 'services.html';
                    break;
                default:
                    alert('Page not found. Please try again.');
                    return;
            }

            window.location.href = pageUrl;
        }
    </script>
</body>

</html>
